<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=yes">
    <meta http-equiv=X-UA-Compatible content="IE=edge">
    <meta name="viewport"
        content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <script type="text/javascript" src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://unpkg.com/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs" type="module"></script>
    <link rel="stylesheet" type="text/css" href="../static/css/index.css">
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/fonts-archive/AppleSDGothicNeo/subsets/AppleSDGothicNeo-dynamic-subset.css"
        type="text/css" />

    <title>홈</title>
</head>

<style>

    #c_1 .button-area {
    position: absolute;
    bottom: 40px;
    width: 100%;
    left: 0;
    gap: 25px;
    display: flex;
    justify-content: center;
}
    #c_1 .btn {
      border:4px solid #fff;
      background:#ffcc00;
    border-radius: 15px;
    padding: 17px;
    width: 20%;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    text-align: center;
    font-size: 16px;
    color:#473934;
    font-weight: 700;
    font-family: 'TTTogether';
    }

  </style>
</head>
<body id="c_1">
  <h1>안녕, 오늘도 반가워!🤚</h1>

  <div class="quests">
    <div class="quest"><input type="checkbox" disabled checked id="q1"><label for="q1">오늘의 일기 쓰기</label></div>
    <div class="quest"><input type="checkbox" id="q2"><label for="q2">오늘의 이야기 보기</label></div>
    <div class="quest"><input type="checkbox" id="q3"><label for="q3">감정 친구랑 대화하기</label></div>
    <div class="quest"><input type="checkbox" disabled checked id="q4"><label for="q4">출석 3일 도전하기!</label></div>
  </div>

  <div class="character">
    <img src="../static/images/tiger_letter.png" alt="호야 캐릭터" />
  </div>

  <div class="button-area">
    <a class="btn highlight" href="c_3_char_select.html">친구랑 대화하기</span></a>
    <a class="btn" href="c_8_diary.html">이야기 보기</span></a>
    <a class="btn">내가 받은 뱃지 보기</span></a>
    <a class="btn stamp">출석도장 쾅!</span></a>
  </div>

  <div id="stamp_pop" style="display: none;">
    <img src="../static/images/stamp.png" alt="출석체크">
    <img class="close" src="../static/images/no-btn.png" alt="x"> 
  </div>

<script>
  $("#c_1 .button-area .btn.stamp").click(function(){
    $("#stamp_pop").show();
  });
  $("#stamp_pop .close").click(function(){
    $("#stamp_pop").hide();
  });
</script>
  
</body>
</html>
