<script>
  const today = new Date();
  const days = ['일', '월', '화', '수', '목', '금', '토'];
  const formattedDate =
    today.getFullYear() + "년 " +
    (today.getMonth() + 1).toString().padStart(2, '0') + "월 " +
    today.getDate().toString().padStart(2, '0') + "일 " +
    "(" + days[today.getDay()] + ")";

  $("#c_8 .diary-date").text(formattedDate);

  let calendar;

  document.addEventListener('DOMContentLoaded', function () {
    const calendarEl = document.getElementById('calendar');
    const calendarTitle = document.getElementById('calendarTitle');

    calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: 'dayGridWeek',
      initialDate: today,
      themeSystem: 'standard',
      headerToolbar: false,
      locale: 'ko',
      selectable: true,

      // 일정 데이터 백엔드에서 불러오기
      events: function(fetchInfo, successCallback, failureCallback) {
        $.ajax({
          url: '/child/diary-events',
          method: 'GET',
          data: {
            start: fetchInfo.startStr,
            end: fetchInfo.endStr
          },
          success: function(response) {
            successCallback(response.events);
          },
          error: function() {
            failureCallback(new Error('일정 데이터를 불러오지 못했습니다.'));
          }
        });
      },

      // 요일 헤더 렌더링
      dayHeaderContent: function (arg) {
        const date = arg.date;
        const dayNum = date.getDate();
        const weekday = date.toLocaleDateString('ko-KR', { weekday: 'short' });
        return { html: `<div class="fc-day-number">${dayNum}</div><div class="fc-weekday">${weekday}</div>` };
      },

      // 주말 색상 처리
      dayCellDidMount: function (info) {
        const day = info.date.getDay();
        const dateStr = info.date.toISOString().split('T')[0];
        if (day === 0) info.el.classList.add('fc-day-sun');
        else if (day === 6) info.el.classList.add('fc-day-sat');
      },

      // 날짜 클릭 시 일기 데이터 불러오기
      // 날짜 클릭 시 일기 데이터 불러오기
      dateClick: function (info) {
        calendar.changeView('dayGridWeek', info.dateStr);

        $.ajax({
          url: '/child/diary-entry',
          method: 'GET',
          data: { date: info.dateStr },
          success: function(data) {
            $(".ani-title").text(data.title);
            $(".diary-weather").text("기분 " + data.weather);
            $(".ani-details video source").attr("src", data.video_url);
            $(".ani-details video")[0].load();
          },
          error: function() {
            alert("해당 날짜의 일기 정보를 불러오지 못했습니다.");
          }
        });
      }      ,

      // 월 제목 갱신
      datesSet: function (info) {
        const date = new Date(info.start);
        const year = date.getFullYear();
        const month = date.toLocaleString('ko-KR', { month: 'long' });
        calendarTitle.textContent = `${year}년 ${month}`;
      }
    });

    calendar.render();

    // 오늘 일기 초기 로딩
    // 오늘 일기 초기 로딩
    const todayStr = today.toISOString().split('T')[0];
    $.ajax({
