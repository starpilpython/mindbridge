<!DOCTYPE html>
<html lang="ko">
<head>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <meta charset="UTF-8" />

  <link rel="stylesheet" type="text/css" href="../static/css/index.css">
  <title>우리아이 감정 대시보드</title>
  <style>
    #toc {
      min-height: auto;
      height: auto;
      padding-bottom: 80px; /* 하단 바 고려 */
    }
    body {
      margin: 0;
      background-color: #f7f9fb;
      font-family: 'Apple SD Gothic Neo', sans-serif;
      min-height: 100%;
    }
    .page-title {
      flex: 1;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      color: #333;
    }

    .back-button svg {
      width: 24px;
      height: 24px;
      cursor: pointer;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
      margin: 16px 20px;
      transition: transform 0.2s;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-3px);
    }

    .date-title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #333;
    }

    .name-label {
      font-size: 14px;
      color: #666;
      margin-bottom: 10px;
    }

    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      font-weight: 500;
    }

    .tag-행복 { background-color: #ffeaaa; color: #6a4e00; }
    .tag-슬픔 { background-color: #d6ecff; color: #1c3f74; }
    .tag-분노 { background-color: #ffc9c9; color: #8c1a1a; }
    .tag-두려움 { background-color: #fbe3ff; color: #742b81; }
    .tag-놀람 { background-color: #e3f5ff; color: #144f6f; }
    .tag-혐오 { background-color: #f9e3e3; color: #852d2d; }
    .tag-중립 { background-color: #e8f6e8; color: #2e6e2e; }

    #summaryRefreshBtn {
      padding: 12px 24px;
      font-size: 14px;
      border: none;
      border-radius: 8px;
      background-color: #4a90e2;
      color: white;
      cursor: pointer;
      margin: 20px auto 30px;
      display: block;
    }
    .summary-line {
      margin-top: 10px;
      font-size: 13px;
      color: #444;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .summary-line strong {
      font-weight: bold;
    }

    .summary-line h1,
    .summary-line h2,
    .summary-line h3 {
      font-size: 16px;
      margin: 8px 0 4px;
      font-weight: bold;
    }

    .summary-line ul {
      padding-left: 20px;
      margin-top: 4px;
      margin-bottom: 4px;
    }

    .summary-line li {
      list-style-type: disc;
      font-size: 13px;
      margin: 2px 0;
    }

    .summary-line p {
      margin: 4px 0;
      font-size: 13px;
      color: #444;
      line-height: 1.5;
    }

    .summary-line strong {
      font-weight: bold;
    }

    .summary-line em {
      font-style: italic;
    }

    .summary-line code {
      background-color: #f4f4f4;
      font-family: monospace;
      padding: 2px 4px;
      border-radius: 4px;
    }

    .page-title {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
      color: #333;
      gap: 8px;
    }

    .inline-icon svg {
      width: 20px;
      height: 20px;
      margin-right: 4px;
      cursor: pointer;
      vertical-align: middle;
    }


    .modern-header {
      width: 100%;
      background-color: #ffffff;
      padding: 14px 20px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .header-container {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .back-button {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      font-size: 18px;
      color: #4a4a4a;
      cursor: pointer;
      font-weight: bold;
      padding: 4px 10px;
    }

    .header-title {
      font-size: 20px;
      font-weight: bold;
      color: #333;
      padding-left: 40px; /* ← 버튼 공간 확보 */
    }

  </style>

  <script>
    const emotionLabelMap = {
      "행복": { label: "행복", class: "tag-행복" },
      "슬픔": { label: "슬픔", class: "tag-슬픔" },
      "분노": { label: "분노", class: "tag-분노" },
      "두려움": { label: "두려움", class: "tag-두려움" },
      "놀람": { label: "놀람", class: "tag-놀람" },
      "혐오": { label: "혐오", class: "tag-혐오" },
      "중립": { label: "중립", class: "tag-중립" }
    };

    function formatKoreanDate(dateStr) {
      const date = new Date(dateStr);
      return `${date.getFullYear()}년 ${date.getMonth() + 1}월 ${date.getDate()}일`;
    }

    function insertOrUpdateCard(data) {
      const toc = document.getElementById("toc");
      const dateKey = data.session_date || data.date;
      const dateLabel = formatKoreanDate(dateKey);
      const user = data.child_name || "이름 없음";

      const rawSummary = data.text_summary || "(요약 없음)";
      const trimmedSummary = rawSummary.length > 100
        ? rawSummary.slice(0, 100) + "..."
        : rawSummary;

      const summaryHtml = marked.parse(trimmedSummary);  // 블록 포함 마크다운 파싱
      const topEmotions = Object.entries(data.top_counts || {})
        .sort((a, b) => b[1] - a[1])
        .slice(0, 3);

      const tagHtml = topEmotions.map(([eng]) => {
        const mapped = emotionLabelMap[eng];
        return mapped ? `<span class="tag ${mapped.class}">${mapped.label}</span>` : '';
      }).join('');

      const cardHtml = `
        <div class="card" id="card-${dateKey}" onclick="goToDetail('${dateKey}', '${user}')">
          <div class="date-title">${dateLabel} 일기</div>
          <div class="name-label">아이 이름: ${user}</div>
          <div class="tag-container">${tagHtml}</div>
          <div class="summary-line">${summaryHtml}</div>
        </div>
      `;

      const existing = document.getElementById(`card-${dateKey}`);
      if (existing) {
        existing.outerHTML = cardHtml;
      } else {
        toc.insertAdjacentHTML('afterbegin', cardHtml);
      }
    }

    function renderToc(data) {
      if (!Array.isArray(data)) {
        console.error("응답이 배열이 아닙니다:", data);
        return;
      }

      [...data].reverse().forEach(item => {
        insertOrUpdateCard(item);
      });

    }

    function goToDetail(date, user) {
      const query = `?date=${encodeURIComponent(date)}&user=${encodeURIComponent(user)}`;
      window.location.href = `/templates/p_4_dashboard.html${query}`;
    }

    document.addEventListener("DOMContentLoaded", () => {
      fetch('https://nfredmpfjwwrknjr.tunnel.elice.io/parent/child_summary_list')
        .then(res => res.json())
        .then(data => {
          renderToc(data);
        })
        .catch(err => {
          console.error('목록 불러오기 실패:', err);
        });
    });

    document.getElementById("summaryRefreshBtn").addEventListener("click", () => {
      fetch('https://nfredmpfjwwrknjr.tunnel.elice.io/parent/lastest_short')
        .then(res => res.json())
        .then(data => {
          insertOrUpdateCard(data);
        })
        .catch(err => {
          console.error("요약 생성 실패:", err);
          alert("요약 생성에 실패했습니다.");
        });
    });


  document.addEventListener("DOMContentLoaded", () => {
  fetch('https://nfredmpfjwwrknjr.tunnel.elice.io/parent/child_summary_list')
    .then(res => res.json())
    .then(data => {
      console.log("▶ 전체 목록 응답 데이터:", data);  // 전체 응답
      data.forEach((item, index) => {
        console.log(`📌 [${index}] 날짜: ${item.date}, 이름: ${item.child_name}`);
        console.log(`👉 감정 데이터:`, item.emotion_counts);
      });

      renderToc(data);  // 기존 카드 렌더링
    })
    .catch(err => {
      console.error('목록 불러오기 실패:', err);
    });
});

  </script>
